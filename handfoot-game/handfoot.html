/* Compact opponent-chip meld indicator. Completed canastas get a solid red/black fill
   capped with a suit glyph (♥ clean / ♠ dirty), mirroring the physical convention of
   topping a finished canasta with a red or black card. Melds still in progress that
   already contain a wild get a small muted wild-count tag instead, so you can see a
   pile trending dirty before it's actually complete — without it reading as "finished". */
function renderOppMeldChip(m){
  const label = esc(meldRankLabel(m.rank));
  if(m.isCanasta){
    if(m.rank==='WILD'){
      return `<span class="rankchip done" style="color:var(--brass-bright)">${label} ${m.cards.length}</span>`;
    }
    const cls = m.type==='clean' ? 'canasta-clean' : 'canasta-dirty';
    const glyph = m.type==='clean' ? '♥' : '♠';
    return `<span class="rankchip ${cls}">${label} ${m.cards.length}<span class="cap-glyph">${glyph}</span></span>`;
  }
  const wildCount = m.cards.filter(isWild).length;
  const wildTag = wildCount>0 ? `<span class="wild-tag">●${wildCount}</span>` : '';
  return `<span class="rankchip ${m.type||''}">${label} ${m.cards.length}${wildTag}</span>`;
}
function renderMeldsBoard(state, pid, {mine}){
  const raw = state.melds[pid]||[];
  const groups = mine ? getDisplayMelds(raw) : sortMelds(raw);
  if(groups.length===0) return `<p class="footnote">No melds yet.</p>`;
  const reordering = mine && ui.meldReorderMode;
  return `<div class="meld-groups">${groups.map(m=>{
    const picked = reordering && ui.meldPickedRank===m.rank;
    const cls = ['meld-group', m.isCanasta?'locked':'', reordering?'reorderable':'', picked?'picked':''].filter(Boolean).join(' ');
    const clickAttr = reordering ? `onclick="pickOrPlaceMeld('${m.rank}')"` : '';
    return `<div class="${cls}" ${clickAttr}>
      <div class="mg-head"><span>${esc(meldRankLabel(m.rank))}</span><span>${meldCountLabel(m)} ${meldBadge(m)}</span></div>
      <div class="mg-cards">${mine ? m.cards.map(renderMiniCard).join('') : `<span class="pill-small">${m.type}</span>`}</div>
    </div>`;
  }).join('')}${reordering && ui.meldPickedRank ? `<div class="meld-group drop-slot" onclick="dropPickedMeldAtEnd()">Drop<br>at end</div>` : ''}</div>`;
}

/* The other players listed in the order they will play *after you*, wrapping around the table.
   Anchored to you, not to the active player: with turn order [A, me, B, C] this always returns
   [B, C, A], for the whole hand, no matter whose turn it currently is.

   Why anchored rather than rotating with the active player: the chips then never change
   position, so "the first chip is the player who receives my discard" is a fact you can rely on
   without re-reading the row. Playtest problem this fixes — the opponent row used to be plain
   seat order, so the player who follows you could sit in the middle of the row, and a discard
   that hands them a card they want is easy to make by mistake.

   Excludes you. Returns turnOrder untouched if you aren't in it (spectator / pre-deal), which
   is what keeps the slice arithmetic from silently duplicating players on an indexOf of -1. */
function opponentTurnOrder(turnOrder, myId){
  const i = turnOrder.indexOf(myId);
  if(i < 0) return turnOrder.slice();
  return turnOrder.slice(i+1).concat(turnOrder.slice(0, i));
}

function renderTable(){
  const s = netState;
  if(localCoverUp(s)) return renderPassCover(s);
  const meIdx = s.turnOrder.indexOf(me.id);
  const activePid = s.turnOrder[s.turnIndex];
  const myHand = getDisplayHand(s.hands[me.id]||[]);
  const top = topDiscard(s);
  const frozen = pileFrozen(s);
  const canPickup = !!top && !frozen && myHand.filter(c=>!isWild(c)&&!isBlackThree(c)&&c.rank===top.rank).length>=2;

  const oppOrder = opponentTurnOrder(s.turnOrder, me.id);
  const nextPid = oppOrder[0] || null;
  const oppRow = oppOrder.map(pid=>{
    const p = s.players.find(x=>x.id===pid);
    const handCt = (s.hands[pid]||[]).length;
    const footCt = (s.feet[pid]||[]).length;
    const canastas = (s.melds[pid]||[]).filter(m=>m.isCanasta);
    const redThrees = s.redThrees[pid]||[];
    const floating = isFloating(s, pid);
    return `<div class="opp-chip ${pid===nextPid?'next-up':''} ${pid===activePid?'active':''}">
      <div class="oname">${esc(p?p.name:'?')} ${pid===activePid?'· turn':''}${pid===nextPid?'<span class="next-badge">NEXT</span>':''}</div>
      <div class="mono" style="font-size:.72rem;color:var(--cream-dim)">Hand ${handCt} · Foot ${s.footOpen[pid]?'open':footCt}${floating?'<span class="floating-badge">☁ Floating</span>':''}</div>
      <div class="melds">${sortMelds(s.melds[pid]||[]).map(renderOppMeldChip).join('')||'<span class="rankchip">—</span>'}</div>
      ${redThrees.length?`<div class="melds" style="margin-top:4px">${redThrees.map(renderMiniRedThree).join('')}<span class="pill-small" style="margin-left:4px">+${redThrees.length*100}</span></div>`:''}
    </div>`;
  }).join('');

  const myScore = (s.scores[me.id]||[]).filter(v=>v!=null).reduce((a,b)=>a+b,0);
  const anyScored = s.turnOrder.some(pid=>(s.scores[pid]||[]).some(v=>v!=null));
  const myRank = anyScored ? (computeRankings(s).find(r=>r.pid===me.id)||{}).rank : null;

  let actionBar = '';
  if(activePid!==me.id){
    actionBar = `<div class="footnote">Waiting on ${esc(nameOf(s,activePid))}…</div>`;
  } else if(s.turnPhase==='draw' && s.pendingSecondDraw){
    const drawnCard = myHand.find(c=>c.id===ui.lastDrawnCardId);
    const fromDiscard = s.pendingSecondDrawSource==='discard';
    actionBar = `
      <div style="width:100%">
        <div class="footnote">First card${drawnCard?' ('+esc(cardLabel(drawnCard))+')':''} taken${fromDiscard?' from the discard pile':' from the stock'}. ${fromDiscard?'Now draw your second card from the stock:':'Choose your second card:'}</div>
        <div class="stg-row" style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" onclick="actCompleteStock()" ${ui.busy?'disabled':''}>Draw 1 more from stock</button>
          ${fromDiscard?'':`<button class="btn secondary" onclick="actCompleteDiscard()" ${(ui.busy||frozen||!top)?'disabled':''}>Take top discard${frozen?' (frozen)':''}</button>`}
        </div>
      </div>`;
  } else if(s.turnPhase==='draw' && !ui.pickupActive){
    actionBar = `
      <button class="btn" onclick="actDrawTwo()" ${ui.busy?'disabled':''}>Draw 2 from stock</button>
      <button class="btn secondary" onclick="actDrawOneStock()" ${ui.busy?'disabled':''}>Draw 1 from stock, then choose</button>
      <button class="btn secondary" onclick="actDrawDiscard()" ${(ui.busy||frozen||!top)?'disabled':''}>Take top discard, then draw stock${frozen?' (frozen)':''}</button>
      <button class="btn secondary" onclick="startPickup()" ${(ui.busy||!canPickup)?'disabled':''}>Matched pickup${frozen?' (frozen)':''}</button>
      ${frozen?'<span class="pill-small">Pile frozen by a black 3</span>':''}
    `;
  } else if(ui.pickupActive){
    const stagedVal = ui.pickupExtra.flat().reduce((sum,id)=>{const c=myHand.find(x=>x.id===id); return sum+(c?cardPointValue(c):0);},0)
      + (ui.pickupNaturals.length===2 ? ui.pickupNaturals.reduce((sum,id)=>{const c=myHand.find(x=>x.id===id); return sum+(c?cardPointValue(c):0);},0) + (top?cardPointValue(top):0) : 0);
    actionBar = `
      <div style="width:100%">
        <div class="footnote">Pick exactly 2 matching cards for the top discard (${top?esc(cardLabel(top)):''}), then optionally stage more melds before confirming.</div>
        <div class="stage-panel">
          <div class="stg-row">Selected pair: ${ui.pickupNaturals.length}/2 ${!s.initialMeldMet[me.id]?`· staged value so far: ${stagedVal}/${s.threshold}`:''}</div>
          ${ui.pickupExtra.length?`<div class="stg-row">Extra staged melds: ${ui.pickupExtra.map((g,i)=>`<span class="pill-small">group ${i+1} (${g.length} cards) <a href="#" onclick="removePickupExtraGroup(${i});return false;" style="color:#ffb;">×</a></span>`).join(' ')}</div>`:''}
          <div class="stg-row">
            <button class="btn small secondary" onclick="addPickupExtraGroup()" ${ui.selected.size===0?'disabled':''}>Stage selected as extra meld</button>
            <button class="btn small" onclick="actConfirmPickup()" ${ui.busy?'disabled':''}>Confirm pickup</button>
            <button class="btn small danger" onclick="cancelPickup()">Cancel</button>
          </div>
        </div>
      </div>`;
  } else if(s.turnPhase==='meld'){
    if(s.initialMeldMet[me.id]){
      const selCards = [...ui.selected].map(id=>myHand.find(c=>c.id===id)).filter(Boolean);
      const allWildSel = selCards.length>0 && selCards.every(isWild);
      const wildTargets = allWildSel ? eligibleWildTargets(s, me.id, selCards.length) : [];
      if(allWildSel && wildTargets.length>0){
        actionBar = `

            </div>
            <div class="stg-row" style="margin-top:6px"><button class="btn secondary" onclick="actMoveToDiscardPhase()" ${ui.busy?'disabled':''}>Skip melding → discard</button></div>
          </div>`;
      } else {
        actionBar = `
          <button class="btn" onclick="actAddMeldNow()" ${ui.selected.size===0||ui.busy?'disabled':''}>Lay selected as meld</button>
          <button class="btn secondary" onclick="actMoveToDiscardPhase()" ${ui.busy?'disabled':''}>Skip melding → discard</button>
        `;
      }
    } else {
      const stagedVal = ui.stagedGroups.flat().reduce((sum,id)=>{const c=myHand.find(x=>x.id===id); return sum+(c?cardPointValue(c):0);},0);
      actionBar = `

              <button class="btn small secondary" onclick="addStagedGroup()" ${ui.selected.size===0?'disabled':''}>Stage selected cards</button>

              <button class="btn small secondary" onclick="actMoveToDiscardPhase()" ${ui.busy?'disabled':''}>Skip melding → discard</button>
            </div>

    }

    /* Name the player who picks up next. Same anchored ordering as the opponent row: whatever
       you discard is offered to the player immediately after you, so this is the moment where
       forgetting who that is actually costs you the hand. */
    const discardTo = nextPid ? nameOf(s, nextPid) : null;
    actionBar = `
      <div class="footnote">Choose 1 card to discard to end your turn.${discardTo?` <span class="discard-to">${esc(discardTo)} picks up next.</span>`:''} ${myHand.length===0?'(No cards — turn will just end.)':''}</div>

      ${myHand.length===0?`<button class="btn secondary" onclick="actMoveToDiscardPhase()">End turn</button>`:''}

  const stagedIds = new Set([...ui.stagedGroups.flat(), ...ui.pickupExtra.flat(), ...ui.pickupNaturals]);

  return `

      <button class="btn small secondary" onclick="toggleScoreboard()">Scoreboard</button>
      ${isLocal()
        ? `<span class="badge" style="padding:4px 10px">PASS &amp; PLAY</span><button class="btn small secondary" onclick="actExitLocalGame()">Menu</button>`
        : `<span class="badge" style="padding:4px 10px">${esc(s.code)}</span>`}
    </div>
  </div>
  <div class="table-body">
    ${ui.error?`<div class="error-box">${esc(ui.error)}</div>`:''}
    <div class="opp-row">${oppRow}</div>
    <div class="mid-row">
      <div class="pile-stack">
        <div class="pile-label">Stock</div>
        <div class="card-back card"></div>
        <div class="pile-count">${s.drawPile.length} left</div>
      </div>
      <div class="pile-stack">
        <div class="pile-label">Discard ${frozen?'(frozen)':''}</div>
        ${top?renderCardEl(top,{big:true}):'<div class="card"> </div>'}
        <div class="pile-count">${s.discardPile.length} in pile</div>
      </div>
      <div class="pile-stack">
        <div class="pile-label">Your foot</div>
        <div class="foot-pile-visual card">${FOOT_ICON_SVG}</div>
        <div class="pile-count">${s.footOpen[me.id] ? 'opened' : ((s.feet[me.id]||[]).length+' cards')}</div>
      </div>
    </div>
    <div class="red3-section">
      <h3>♥ Red 3s</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${(s.redThrees[me.id]||[]).length ? (s.redThrees[me.id]||[]).map(renderRedThreeCard).join('') : '<span class="footnote">None banked yet this hand</span>'}</div>
      <span class="red3-total">+${(s.redThrees[me.id]||[]).length*100} pts</span>
    </div>
    <div class="melds-board">
      <div class="flex-between">
        <h3 style="margin:0">Your melds</h3>
        <div style="display:flex;gap:8px">
          <button class="btn small secondary" onclick="sortMyMelds()">Sort ascending</button>
          <button class="btn small ${ui.meldReorderMode?'':'secondary'}" onclick="toggleMeldReorderMode()">${ui.meldReorderMode?'Done reordering':'Reorder melds'}</button>
        </div>
      </div>
      ${ui.meldReorderMode?`<div class="footnote">${ui.meldPickedRank?'Meld picked up — tap another to move it there, tap it again to cancel, or drop it at the end.':'Tap a meld to pick it up, then tap another to move it there. Only changes how melds look on your own screen.'}</div>`:''}
      ${renderMeldsBoard(s, me.id, {mine:true})}
    </div>
    <div class="hand-area">
      <div class="flex-between">
        <h3 style="margin:0 0 8px">Your hand (${myHand.length})${isFloating(s, me.id)?'<span class="floating-badge">☁ Floating</span>':''}</h3>
        <div style="display:flex;gap:8px">
          <button class="btn small secondary" onclick="sortMyHand()">Sort ascending</button>
          <button class="btn small ${ui.reorderMode?'':'secondary'}" onclick="toggleReorderMode()">${ui.reorderMode?'Done reordering':'Reorder cards'}</button>
        </div>
      </div>
      ${ui.reorderMode?`<div class="footnote">${ui.pickedCardId?'Card picked up — tap another card to move it there, tap it again to cancel, or drop it at the end below.':'Tap a card to pick it up, then tap another card to move it there. Works any time, even when it is not your turn.'}</div>`:''}
      ${!ui.reorderMode && ui.drawnThisTurnIds.size>0?`<div class="footnote">Cards with a red border were drawn this turn.</div>`:''}
      <div class="hand-row">
        ${myHand.map((c,cardIdx)=>{
          let attr, selectedNow, disabled=false, interactable;
          if(ui.reorderMode){
            attr = `onclick="pickOrPlaceCard('${c.id}')"`;
            selectedNow = ui.pickedCardId===c.id;
            interactable = true;
          } else {
            const isPickupTarget = ui.pickupActive;
            disabled = false;
            if(isPickupTarget){
              const pickupCommittedIds = new Set(ui.pickupExtra.flat());
              if(ui.pickupNaturals.includes(c.id)){
                attr = `onclick="confirmPickupNaturalPick('${c.id}')"`;
                selectedNow = true;
              } else if(pickupCommittedIds.has(c.id)){
                attr = '';
                selectedNow = true;
                disabled = true;
              } else if(ui.pickupNaturals.length < 2){
                attr = `onclick="confirmPickupNaturalPick('${c.id}')"`;
                selectedNow = false;
              } else {
                attr = `onclick="toggleSelect('${c.id}')"`;
                selectedNow = ui.selected.has(c.id);
              }
            } else {
              selectedNow = s.turnPhase==='discard' ? ui.discardChoice===c.id : ui.selected.has(c.id) || stagedIds.has(c.id);
              disabled = stagedIds.has(c.id) && !ui.selected.has(c.id);
              if(activePid!==me.id){ attr = ''; }
              else if(s.turnPhase==='discard'){ attr = `onclick="pickDiscard('${c.id}')"`; }
              else if(s.turnPhase==='meld'){ attr = disabled? '' : `onclick="toggleSelect('${c.id}')"`; }
              else { attr=''; }
            }
            interactable = activePid===me.id && !(s.turnPhase==='draw' && s.pendingSecondDraw);
          }
          return renderCardEl(c, {clickable: interactable && !disabled, selected: selectedNow, newDraw: ui.drawnThisTurnIds.has(c.id), dealDelayMs: dealDelayForIndex(cardIdx), onClickAttr: attr});
        }).join('')}
        ${ui.reorderMode && ui.pickedCardId ? `<div class="card clickable" style="border:2px dashed var(--brass);background:transparent;color:var(--brass-bright);font-size:.7rem" onclick="dropPickedAtEnd()">Drop<br>at end</div>` : ''}
      </div>
    </div>
    <div class="panel">
      <h3 style="margin-top:0;font-size:.9rem">Table log</h3>
      <div class="log-box" id="logBox">${(s.log||[]).slice(-16).reverse().map(l=>`<div>${esc(l)}</div>`).join('')}</div>
    </div>
  </div>
  <div class="action-bar">${actionBar}</div>
  ${s.phase==='roundEnd' ? renderRoundEndModal() : ''}
  ${s.phase==='gameOver' ? renderGameOverModal() : ''}
  ${renderScoreboardModal(s)}
  ${renderDrawOverlay()}
  ${renderRedThreeOverlay()}
  ${renderDealBanner(s)}
  `;
}

function ordinal(n){
  const suf=['th','st','nd','rd'], v=n%100;
  return n + (suf[(v-20)%10] || suf[v] || suf[0]);
}
function formatElapsed(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(totalSec/60);
  const sec = totalSec%60;
  return `${m}:${sec<10?'0':''}${sec}`;
}
function computeRankings(s){
  const rows = s.turnOrder.map(pid=>{
    const rounds = s.scores[pid]||[null,null,null,null];
    const total = rounds.filter(v=>v!=null).reduce((a,b)=>a+b,0);
    return {pid, rounds, total};
  });
  rows.sort((a,b)=>b.total-a.total);
  let rank=0, prevTotal=null;
  rows.forEach((r,i)=>{
    if(r.total!==prevTotal){ rank=i+1; prevTotal=r.total; }
    r.rank = rank;
  });
  return rows;
}
function renderBreakdownTable(s, bd){
  return `<table class="score-table">
    <tr><th>Player</th><th>Melds</th><th>Canasta bonus</th><th>Red 3s</th><th>Hand −</th><th>Foot −</th><th>Round total</th></tr>
    ${s.turnOrder.map(pid=>{
      const b = (bd||{})[pid] || {meldValue:0,canastaBonus:0,redThreeCount:0,redThreeBonus:0,handPenalty:0,footPenalty:0,total:0};
      return `<tr><td>${esc(nameOf(s,pid))}${pid===me.id?' (you)':''}</td><td>${b.meldValue}</td><td>${b.canastaBonus}</td><td>${b.redThreeCount}× (${b.redThreeBonus})</td><td>−${b.handPenalty}</td><td>−${b.footPenalty}</td><td><b>${b.total}</b></td></tr>`;
    }).join('')}
  </table>`;
}
function renderRoundEndModal(){
  const s = netState;
  const isHost = iAmHost(s);
  const bd = (s.roundBreakdowns||{})[s.round] || {};
  return `<div class="modal-bg"><div class="modal">
    <h2 style="margin-top:0;color:var(--brass-bright)">Hand ${s.round} complete</h2>
    <p>${esc(nameOf(s,s.wentOutPlayer))} went out.</p>
    <table class="score-table">
      <tr><th>Player</th>${[1,2,3,4].map(r=>`<th>H${r}</th>`).join('')}<th>Total</th></tr>
      ${s.turnOrder.map(pid=>{
        const rounds = s.scores[pid]||[null,null,null,null];
        const total = rounds.filter(v=>v!=null).reduce((a,b)=>a+b,0);
        return `<tr><td>${esc(nameOf(s,pid))}${pid===me.id?' (you)':''}</td>${rounds.map(v=>`<td>${v==null?'—':v}</td>`).join('')}<td><b>${total}</b></td></tr>`;
      }).join('')}
    </table>
    <h3 style="font-size:.9rem;color:var(--brass-bright);margin-bottom:6px">This hand's breakdown</h3>
    ${renderBreakdownTable(s, bd)}
    <p class="footnote">Round total = melds + canasta bonus + (red 3s × 100) − cards left in hand − cards left in foot.</p>
    ${isHost
      ? `<button class="btn" onclick="actContinueRound()" ${ui.busy?'disabled':''}>${s.round>=4?'See final results':'Deal hand '+(s.round+1)}</button>`
      : `<p class="footnote">Waiting for the host to continue…</p>`}
  </div></div>`;
}

function renderGameOverModal(){
  const s = netState;
  const isHost = iAmHost(s);
  const totals = s.turnOrder.map(pid=>({pid, total:(s.scores[pid]||[]).filter(v=>v!=null).reduce((a,b)=>a+b,0)}));
  totals.sort((a,b)=>b.total-a.total);
  return `<div class="modal-bg"><div class="modal">
    <h2 style="margin-top:0;color:var(--brass-bright)">Final standings</h2>
    <table class="score-table">
      <tr><th>Rank</th><th>Player</th><th>Total</th></tr>
      ${totals.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(nameOf(s,t.pid))}${t.pid===me.id?' (you)':''}${i===0?' 🏆':''}</td><td><b>${t.total}</b></td></tr>`).join('')}
    </table>
    ${isHost?`<button class="btn" onclick="actNewGame()" ${ui.busy?'disabled':''}>Start a new game</button>`:`<p class="footnote">Waiting for the host to start a new game…</p>`}
  </div></div>`;
}
function renderScoreboardModal(s){
  if(!ui.scoreboardOpen) return '';
  const rankings = computeRankings(s);
  const completedHands = Object.keys(s.roundBreakdowns||{}).map(Number).sort((a,b)=>a-b);
  const bd = ui.scoreboardHandView!=null ? (s.roundBreakdowns||{})[ui.scoreboardHandView] : null;
  return `<div class="modal-bg" onclick="if(event.target===this) toggleScoreboard()"><div class="modal">
    <div class="flex-between">
      <h2 style="margin:0;color:var(--brass-bright)">Scoreboard</h2>
      <button class="btn small secondary" onclick="toggleScoreboard()">Close</button>
    </div>
    <table class="score-table" style="margin-top:12px">
      <tr><th>Rank</th><th>Player</th>${[1,2,3,4].map(r=>`<th>H${r}</th>`).join('')}<th>Total</th></tr>
      ${rankings.map(r=>`<tr><td>${ordinal(r.rank)}</td><td>${esc(nameOf(s,r.pid))}${r.pid===me.id?' (you)':''}</td>${r.rounds.map(v=>`<td>${v==null?'—':v}</td>`).join('')}<td><b>${r.total}</b></td></tr>`).join('')}
    </table>
    ${completedHands.length?`
      <h3 style="font-size:.85rem;color:var(--brass-bright);margin:14px 0 6px">View a hand's breakdown</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        ${completedHands.map(n=>`<button class="btn small ${ui.scoreboardHandView===n?'':'secondary'}" onclick="viewHandBreakdown(${n})">Hand ${n}</button>`).join('')}
      </div>
      ${bd?renderBreakdownTable(s, bd):''}
    `:'<p class="footnote">No hands completed yet — breakdowns will show up here once the first one finishes.</p>'}
  </div></div>`;
}

function render(){
  const app = document.getElementById('app');
  if(!netState){
    if(ui.screen!=='localSetup') ui.screen='landing';
    app.innerHTML = ui.screen==='localSetup' ? renderLocalSetup() : renderLanding();
    return;
  }
  syncLocalSeat();   // pass-and-play: become the active player (before the chime check below)
  checkForDealTransition(netState);
  checkForTurnStartChime(netState);
  checkForRedThreeChime(netState);
  if(netState.phase==='lobby'){ app.innerHTML = renderLobby(); return; }

  // This app replaces #app's entire innerHTML on every render — including the once-a-second
  // timer tick and the ~1.8s poll, not just user actions — which would otherwise reset the
  // table log's scroll position back to the top constantly. Capture it before the rebuild and
  // restore it after, so scrolling through log history actually stays put.
  const prevLogBox = document.getElementById('logBox');
  const prevScrollTop = prevLogBox ? prevLogBox.scrollTop : 0;

  app.innerHTML = renderTable();

  const newLogBox = document.getElementById('logBox');
  if(newLogBox) newLogBox.scrollTop = prevScrollTop;
}

render();
initBackend();
setInterval(()=>{ if(netState && netState.phase==='playing'){ render(); } }, 1000);

/* Offline support for the installed app. Only on a real https host: not inside Claude (where
   sw.js doesn't exist and service workers aren't available), not from a file on disk. */
try{
  if('serviceWorker' in navigator && location.protocol==='https:' && !/claude/i.test(location.hostname)){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(e=>console.warn('Offline support unavailable:', e));
    });
  }
}catch(e){}
</script>
</body>
</html>
